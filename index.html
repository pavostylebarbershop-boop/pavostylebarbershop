<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pavo Style Barber Shop</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Pavo Style Barber Shop">
  <meta name="description" content="Professional barber shop in Hialeah. Book your appointment today.">

  <!-- Open Graph -->
  <meta property="og:title" content="Pavo Style Barber Shop">
  <meta property="og:description" content="Clean fades, sharp styles, professional service in Hialeah.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pavostylebarbershop.com">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: #0b0b0b;
      color: #f5f5f5;
    }

    header {
      background: linear-gradient(180deg, #000 0%, #111 100%);
      text-align: center;
      padding: 40px 20px;
    }

    header img {
      max-width: 260px;
      width: 100%;
      height: auto;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      padding: 0 20px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #c9a227;
      margin-bottom: 30px;
    }

    .info {
      font-size: 1.1rem;
      line-height: 1.8;
      color: #ddd;
    }

    .info a {
      color: #c9a227;
      text-decoration: none;
      font-weight: 600;
    }

    .buttons {
      margin-top: 40px;
    }

    .btn {
      display: inline-block;
      margin: 10px;
      padding: 15px 35px;
      background: #c9a227;
      color: #000;
      text-decoration: none;
      font-weight: 700;
      border-radius: 50px;
      transition: all 0.3s ease;
    }

    .btn.secondary {
      background: transparent;
      color: #c9a227;
      border: 2px solid #c9a227;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(201,162,39,0.3);
    }

    /* WHATSAPP FLOAT BUTTON */
    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #25D366;
      color: #fff;
      border-radius: 50px;
      padding: 14px 22px;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      z-index: 999;
      transition: transform 0.3s ease;
    }

    .whatsapp-float:hover {
      transform: scale(1.08);
    }

    footer {
      margin-top: 80px;
      padding: 25px;
      text-align: center;
      font-size: 0.9rem;
      color: #aaa;
      background: #000;
    }
  </style>
</head>

<body>

  <!-- LOGO -->
  <header>
    <img src="logo.png" alt="Pavo Style Barber Shop Logo">
  </header>

  <!-- CONTENT -->
  <div class="container">
    <h1>Pavo Style Barber Shop</h1>
    <div class="subtitle">Clean Fades • Sharp Styles • Professional Service</div>

    <div class="info">
      📍 
      <a href="https://www.google.com/maps/place/Pavo+style+barber+shop/@25.848252,-80.303366"
         target="_blank">
        1051 W 29th St #2, Hialeah, FL 33012
      </a>
      <br>
      📞 <a href="tel:+17868199106">+1 (786) 819-9106</a>
      <br>
      ⏰ Open daily: <strong>9:00 AM – 9:00 PM</strong>
    </div>

    <div class="buttons">
      <a class="btn" href="tel:+17868199106">Call to Book</a>
      <a class="btn secondary"
         href="https://www.google.com/maps/place/Pavo+style+barber+shop/@25.848252,-80.303366"
         target="_blank">
        Get Directions
      </a>
    </div>
  </div>

  <!-- WHATSAPP BUTTON -->
  <a class="whatsapp-float"
     href="https://wa.me/17868199106?text=Hello%20Pavo%20Style%20Barber%20Shop,%20I%20would%20like%20to%20book%20an%20appointment."
     target="_blank">
    💬 WhatsApp
  </a>

  <!-- FOOTER -->
  <footer>
    © 2026 Pavo Style Barber Shop Inc. • All rights reserved
  </footer>

</body>
</html>
